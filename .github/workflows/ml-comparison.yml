name: Supplementary ML comparison tests
on: [push, pull_request]
jobs:
  comparison-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r comparison_study/requirements.txt
      - run: python -m unittest discover -s comparison_study/tests -v
