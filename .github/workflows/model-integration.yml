name: Model integration analytic tests
on: [push, pull_request]
jobs:
  analytic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.0.2
      - run: python -m unittest discover -s model_integration/tests -v
