<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZERO — Product Demo</title>
<style>
:root{
  --bg:#000; --panel:#0a0a0a; --panel2:#0f0f10;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#ededed; --muted:#8a8a8f; --dim:#4a4a50;
  --red:#ff3b3b; --red-d:rgba(255,59,59,.12);
  --green:#3ee08f; --green-d:rgba(62,224,143,.10);
  --amber:#f5b544; --blue:#8ab4ff;
  --sans:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono","SF Mono","Fira Code",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;color:var(--text);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;overflow:hidden;background:#000}
#stage::before{content:"";position:absolute;inset:0;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:48px 48px;opacity:.35;
  -webkit-mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000 0%,transparent 75%);mask-image:radial-gradient(ellipse 70% 60% at 50% 40%,#000 0%,transparent 75%)}
#glow{position:absolute;left:50%;top:-320px;width:1200px;height:600px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,255,255,.07),transparent);transition:background 1s ease;pointer-events:none}
.breach #glow{background:radial-gradient(closest-side,rgba(255,59,59,.16),transparent)}
.fix #glow{background:radial-gradient(closest-side,rgba(245,181,68,.08),transparent)}
.verified #glow{background:radial-gradient(closest-side,rgba(62,224,143,.12),transparent)}

#ui{position:absolute;inset:0;padding:28px 44px 36px}
/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;height:36px;font-size:13px;color:var(--muted)}
.brand{display:flex;align-items:center;gap:14px}
.mark{display:flex;align-items:center;gap:9px;color:var(--text);font-weight:600;letter-spacing:.22em;font-size:13px}
.mark i{width:16px;height:16px;border:1.5px solid var(--text);border-radius:50%;position:relative;display:block}
.mark i::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1.5px;background:var(--text);transform:translateX(-50%) rotate(35deg)}
.sep{color:var(--dim)}
.crumb b{color:var(--text);font-weight:500}
.zstat{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line2);border-radius:999px;font-family:var(--mono);font-size:12px;transition:all .4s}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 0 currentColor;transition:background .3s}
.zstat.ok{color:var(--green);border-color:rgba(62,224,143,.3)} .zstat.ok .dot{background:var(--green);animation:pulse 1.6s infinite}
.zstat.bad{color:var(--red);border-color:rgba(255,59,59,.45);background:var(--red-d)} .zstat.bad .dot{background:var(--red);animation:pulseR .8s infinite}
.zstat.work{color:var(--amber);border-color:rgba(245,181,68,.35)} .zstat.work .dot{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,224,143,.5)}100%{box-shadow:0 0 0 8px rgba(62,224,143,0)}}
@keyframes pulseR{0%{box-shadow:0 0 0 0 rgba(255,59,59,.7)}100%{box-shadow:0 0 0 9px rgba(255,59,59,0)}}
.timer{font-family:var(--mono);font-size:12px;color:var(--dim)}
#prog{position:absolute;left:0;top:0;height:2px;width:0;background:linear-gradient(90deg,transparent,#fff);opacity:.5}

/* caption */
.cap{display:flex;align-items:flex-end;justify-content:space-between;margin:34px 0 26px;height:92px}
.cap-l{transition:opacity .3s ease,transform .3s ease,filter .3s}
.cap-l.out{opacity:0;transform:translateY(8px);filter:blur(4px)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;color:var(--muted);margin-bottom:12px;display:flex;gap:10px;align-items:center}
.eyebrow span{color:var(--text)}
.breach .eyebrow span{color:var(--red)} .fix .eyebrow span{color:var(--amber)} .verified .eyebrow span{color:var(--green)}
h1{font-size:44px;font-weight:600;letter-spacing:-.03em;line-height:1.05;
  background:linear-gradient(180deg,#fff 30%,#9a9a9f);-webkit-background-clip:text;background-clip:text;color:transparent}
.status{display:flex;align-items:center;gap:10px;padding:10px 16px;border:1px solid var(--line2);border-radius:10px;background:rgba(255,255,255,.02);font-size:14px;color:var(--muted);transition:all .4s;opacity:0;transform:translateY(6px)}
.status.on{opacity:1;transform:none}
.status b{color:var(--text);font-weight:500}
.status.ok{border-color:rgba(62,224,143,.3)} .status.ok .dot{background:var(--green);animation:pulse 1.6s infinite}
.status.bad{border-color:rgba(255,59,59,.5);background:var(--red-d)} .status.bad .dot{background:var(--red);animation:pulseR .8s infinite} .status.bad b{color:#ff8a8a}
.status.work{border-color:rgba(245,181,68,.35)} .status.work .dot{background:var(--amber);animation:pulse 1s infinite}

/* grid */
.grid{display:grid;grid-template-columns:840px 1fr;gap:20px;height:640px}
.panel{border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.01));overflow:hidden;position:relative;transition:border-color .5s,box-shadow .5s}
.ph{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.ph .l{display:flex;align-items:center;gap:10px}
.lights{display:flex;gap:6px}.lights i{width:10px;height:10px;border-radius:50%;background:#1d1d20;border:1px solid #2a2a2e;display:block}
.tab{font-family:var(--mono);color:var(--text);padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.03)}
.tag{font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:5px;border:1px solid var(--line2);color:var(--muted);transition:all .4s}
.tag.ai{color:#c9b8ff;border-color:rgba(167,139,250,.3);background:rgba(167,139,250,.07)}
.tag.zero{color:var(--amber);border-color:rgba(245,181,68,.35);background:rgba(245,181,68,.07)}
.tag.okk{color:var(--green);border-color:rgba(62,224,143,.35);background:var(--green-d)}

/* editor */
.code{padding:18px 0;font-family:var(--mono);font-size:14.5px;line-height:27px}
.ln{display:flex;opacity:0;transform:translateX(-6px);transition:opacity .25s,transform .25s,background .35s;position:relative;white-space:pre}
.ln.show{opacity:1;transform:none}
.ln .g{width:56px;text-align:right;padding-right:22px;color:#3a3a40;flex:none;user-select:none}
.ln .c{color:#cfcfd4}
.k{color:#c4a7ff}.s{color:#9be0b4}.f{color:#8ab4ff}.cm{color:#55555c;font-style:italic}.p{color:#7a7a82}.n{color:#f2c27b}
.ln.vuln{background:linear-gradient(90deg,rgba(255,59,59,.16),rgba(255,59,59,.04))}
.ln.vuln::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--red);box-shadow:0 0 12px var(--red)}
.ln.vuln .c{text-decoration:underline wavy rgba(255,59,59,.8);text-underline-offset:6px;text-decoration-thickness:1px}
.ln .why{position:absolute;right:16px;top:3px;font-size:11px;line-height:20px;padding:0 8px;border-radius:4px;color:#ff8a8a;border:1px solid rgba(255,59,59,.4);background:rgba(20,0,0,.8);opacity:0;transform:translateX(6px);transition:all .3s}
.ln.vuln .why{opacity:1;transform:none}
.ln.del{background:rgba(255,59,59,.10)} .ln.del::before{display:none}
.ln.del .c{text-decoration:line-through;text-decoration-color:rgba(255,59,59,.6);color:#ff9a9a;opacity:.75}
.ln.del .g,.ln.add .g{font-weight:700}
.ln.del .g{color:var(--red)} .ln.del .why{opacity:0}
.ln.add{max-height:0;overflow:hidden;background:rgba(62,224,143,.10);transition:max-height .45s cubic-bezier(.2,.8,.2,1),opacity .4s,transform .4s}
.ln.add.show{max-height:27px}
.ln.add .g{color:var(--green)}
.ln.add::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--green);box-shadow:0 0 10px var(--green)}
.caret{display:inline-block;width:8px;height:17px;background:#fff;vertical-align:-3px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ebar{position:absolute;left:0;right:0;bottom:0;height:34px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.ebar .r{display:flex;gap:18px}
#eStat{transition:color .3s}
.commit{margin:4px 16px 0 56px;display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:13px;color:var(--muted);opacity:0;transform:translateY(6px);transition:all .45s cubic-bezier(.2,.8,.2,1);position:absolute;left:0;right:0;bottom:50px}
.commit.show{opacity:1;transform:none}
.commit .av{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#d97757,#a35a3f);display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
.commit b{color:var(--text);font-weight:500}
.commit .ok{margin-left:auto;color:var(--green);font-family:var(--mono);font-size:12px}

/* right column */
.right{display:grid;grid-template-rows:370px 1fr;gap:20px;min-height:0}
.map{position:relative;height:330px}
.map svg{position:absolute;inset:0;overflow:visible}
.wire{stroke:rgba(255,255,255,.18);stroke-width:1.2;fill:none;stroke-dasharray:3 5;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
.wire.ok{stroke:rgba(62,224,143,.55)}
#breachPath{stroke:var(--red);stroke-width:1.6;fill:none;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 6px rgba(255,59,59,.9));transition:stroke-dashoffset .9s cubic-bezier(.6,0,.2,1),opacity .6s}
#breachPath.draw{stroke-dashoffset:0}
#breachPath.gone{opacity:0}
#atkPath{stroke:var(--red);stroke-width:1.4;fill:none;stroke-dasharray:1;stroke-dashoffset:1;opacity:.9;transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1),opacity .6s}
#atkPath.go{stroke-dashoffset:.5}
#atkPath.fade{opacity:0}
.node{position:absolute;display:flex;align-items:center;gap:11px;padding:10px 14px 10px 10px;border:1px solid var(--line2);border-radius:10px;background:#070707;font-size:13px;transition:all .4s;width:150px}
.node .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.node small{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}
.node.alice .av{background:rgba(138,180,255,.12);color:var(--blue);border:1px solid rgba(138,180,255,.35)}
.node.bob .av{background:rgba(242,194,123,.10);color:#f2c27b;border:1px solid rgba(242,194,123,.35)}
.node.bob.attacker{border-color:rgba(255,59,59,.55);box-shadow:0 0 0 4px rgba(255,59,59,.07)}
.db{position:absolute;width:186px;padding:11px 12px;border:1px solid var(--line2);border-radius:10px;background:#070707;font-size:12px;transition:all .4s}
.db .h{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;font-family:var(--mono);font-size:11.5px;color:var(--text)}
.db .h span{display:flex;gap:7px;align-items:center}
.db .lock{font-size:10px;color:var(--muted);transition:color .3s}
.row{height:16px;border-radius:3px;background:rgba(255,255,255,.04);margin-top:5px;display:flex;align-items:center;padding:0 7px;gap:6px;font-family:var(--mono);font-size:9.5px;color:#6b6b72;transition:all .3s}
.row i{width:5px;height:5px;border-radius:50%;background:#333;transition:background .3s}
.db.leak{border-color:rgba(255,59,59,.7);box-shadow:0 0 0 4px rgba(255,59,59,.08),0 0 40px rgba(255,59,59,.18)}
.db.leak .row{background:rgba(255,59,59,.12);color:#ff9a9a;animation:leak .5s infinite alternate}
.db.leak .row:nth-child(3){animation-delay:.15s}.db.leak .row:nth-child(4){animation-delay:.3s}
.db.leak .row i{background:var(--red)}
.db.leak .lock{color:var(--red)}
@keyframes leak{to{background:rgba(255,59,59,.04)}}
.db.safe{border-color:rgba(62,224,143,.45);box-shadow:0 0 0 4px rgba(62,224,143,.05)}
.db.safe .row i{background:var(--green)} .db.safe .lock{color:var(--green)}
.leaklbl{position:absolute;font-family:var(--mono);font-size:10.5px;color:#ff8a8a;padding:3px 8px;border:1px solid rgba(255,59,59,.45);border-radius:5px;background:#120202;opacity:0;transform:translateY(4px);transition:all .35s}
.leaklbl.show{opacity:1;transform:none}
.pk{position:absolute;left:0;top:0;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#ff6b6b;box-shadow:0 0 10px 2px rgba(255,59,59,.9);offset-path:path("M170 236 C300 236, 310 76, 440 76");offset-rotate:0deg;offset-distance:0%;opacity:0}
.pk.run{animation:pk 1.1s linear infinite}
.pk.blk{animation:pkb 1s cubic-bezier(.3,0,.6,1) infinite}
@keyframes pk{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes pkb{0%{offset-distance:0%;opacity:0}15%{opacity:1}80%{opacity:1;offset-distance:47%}100%{offset-distance:48%;opacity:0}}
.shield{position:absolute;left:305px;top:156px;transform:translate(-50%,-50%) scale(.6);display:flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid rgba(62,224,143,.6);border-radius:8px;background:#021208;color:var(--green);font-family:var(--mono);font-size:11px;font-weight:600;opacity:0;transition:all .45s cubic-bezier(.2,1.4,.4,1);box-shadow:0 0 30px rgba(62,224,143,.25)}
.shield.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.shield::before{content:"";position:absolute;inset:-10px;border:1px solid rgba(62,224,143,.4);border-radius:12px;animation:ring 1.4s ease-out infinite}
@keyframes ring{from{opacity:1;transform:scale(.9)}to{opacity:0;transform:scale(1.3)}}
.inv{position:absolute;left:14px;right:14px;bottom:12px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted)}
.inv b{font-weight:500;transition:color .3s}

/* terminal */
.term{padding:14px 16px;font-family:var(--mono);font-size:12.5px;line-height:21px;color:#b8b8be;height:calc(100% - 40px);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.tl{opacity:0;transform:translateY(4px);transition:all .25s;white-space:pre}
.tl.show{opacity:1;transform:none}
.tl .g{color:var(--green)}.tl .r{color:var(--red)}.tl .m{color:var(--dim)}.tl .a{color:var(--amber)}.tl .w{color:#fff}
.tl.sum{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line2)}

/* alert */
.alert{position:absolute;left:424px;bottom:110px;width:440px;z-index:5;border:1px solid rgba(255,59,59,.55);border-radius:12px;background:rgba(14,2,2,.92);backdrop-filter:blur(10px);padding:18px 20px;box-shadow:0 0 0 6px rgba(255,59,59,.06),0 30px 80px rgba(255,0,0,.25);opacity:0;transform:translateY(14px) scale(.98);transition:all .5s cubic-bezier(.2,.9,.2,1);pointer-events:none}
.alert.show{opacity:1;transform:none}
.alert .t{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--red);margin-bottom:10px}
.alert .t em{font-style:normal;padding:2px 7px;border-radius:4px;background:var(--red);color:#000;font-weight:700;letter-spacing:.08em}
.alert h3{font-size:21px;font-weight:600;letter-spacing:-.01em;color:#fff}
.alert p{color:#ff9a9a;font-size:14px;margin-top:4px}
.alert code{display:block;margin-top:12px;padding:9px 11px;border-radius:7px;border:1px solid rgba(255,59,59,.25);background:rgba(0,0,0,.5);font-family:var(--mono);font-size:12px;color:#d8d8dc}
.alert code s{color:var(--red);text-decoration:none}

/* flash */
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:8;
  background:radial-gradient(ellipse at center,rgba(255,0,0,.05),rgba(255,30,30,.35));box-shadow:inset 0 0 160px rgba(255,30,30,.55)}
#flash.go{animation:flash 1.1s ease-out}
@keyframes flash{0%{opacity:0}8%{opacity:1}30%{opacity:.25}42%{opacity:.8}100%{opacity:0}}
#ui.shake{animation:shake .35s linear}
@keyframes shake{20%{transform:translate(-2px,1px)}40%{transform:translate(2px,-1px)}60%{transform:translate(-1px,0)}80%{transform:translate(1px,1px)}}
.breach .panel.ed{border-color:rgba(255,59,59,.3)}
.verified .panel{border-color:rgba(62,224,143,.18)}

/* finale */
#final{position:absolute;inset:0;z-index:10;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .9s ease}
#final.show{opacity:1;pointer-events:auto}
#final::before{content:"";position:absolute;left:50%;top:50%;width:900px;height:900px;transform:translate(-50%,-55%);border-radius:50%;background:radial-gradient(closest-side,rgba(62,224,143,.10),rgba(255,255,255,.03) 50%,transparent)}
#final::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:48px 48px;opacity:.3;-webkit-mask-image:radial-gradient(circle at 50% 45%,#000,transparent 55%);mask-image:radial-gradient(circle at 50% 45%,#000,transparent 55%)}
.zring{position:relative;z-index:1;width:84px;height:84px;margin-bottom:34px;opacity:0;transform:scale(.7) rotate(-40deg);transition:all 1s cubic-bezier(.2,.9,.2,1)}
.zring svg{width:100%;height:100%}
.word{position:relative;z-index:1;display:flex;gap:.04em;font-size:168px;font-weight:700;letter-spacing:.12em;line-height:1;padding-left:.12em}
.word span{display:inline-block;opacity:0;filter:blur(18px);transform:translateY(20px);transition:all .9s cubic-bezier(.2,.9,.2,1);
  background:linear-gradient(180deg,#fff 35%,#7d7d84);-webkit-background-clip:text;background-clip:text;color:transparent}
.tagline{position:relative;z-index:1;margin-top:34px;font-size:30px;font-weight:500;letter-spacing:-.02em;color:var(--muted);opacity:0;transform:translateY(10px);transition:all .8s ease}
.tagline b{color:#fff;font-weight:500}
.stats{position:relative;z-index:1;margin-top:34px;display:flex;gap:10px;opacity:0;transition:opacity .8s}
.stats div{font-family:var(--mono);font-size:12px;padding:7px 12px;border:1px solid var(--line2);border-radius:999px;color:var(--muted);display:flex;gap:8px;align-items:center}
.stats .dot{background:var(--green)}
#replay{position:relative;z-index:1;margin-top:46px;font:500 14px var(--sans);color:var(--text);background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:999px;padding:11px 22px;cursor:pointer;display:flex;align-items:center;gap:9px;opacity:0;transform:translateY(8px);transition:all .6s,background .2s,border-color .2s}
#replay:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3)}
#final.s1 .zring{opacity:1;transform:none}
#final.s2 .word span{opacity:1;filter:none;transform:none}
#final.s3 .tagline{opacity:1;transform:none}
#final.s4 .stats{opacity:1}
#final.s5 #replay{opacity:1;transform:none}
</style>
</head>
<body>
<div id="stage"></div>

<template id="tpl">
  <div id="glow"></div>
  <div id="prog"></div>
  <div id="ui">
    <div class="top">
      <div class="brand">
        <div class="mark"><i></i>ZERO</div>
        <span class="sep">/</span>
        <span class="crumb">acme-crm <span class="sep">/</span> <b>production</b></span>
      </div>
      <div style="display:flex;gap:16px;align-items:center">
        <div class="zstat ok" id="zstat"><span class="dot"></span><span id="zstatT">agent · watching 24 invariants</span></div>
        <span class="timer" id="timer">00:00</span>
      </div>
    </div>

    <div class="cap">
      <div class="cap-l" id="capL">
        <div class="eyebrow">01 <span>THE BUILD</span></div>
        <h1>Claude just shipped your latest feature.</h1>
      </div>
      <div class="status" id="status"><span class="dot"></span><span>Status:</span><b id="statusT">Deployment successful</b></div>
    </div>

    <div class="grid">
      <div class="panel ed">
        <div class="ph">
          <div class="l"><div class="lights"><i></i><i></i><i></i></div><span class="tab">app/api/records/route.ts</span></div>
          <span class="tag ai" id="edTag">✦ Claude · AI-generated</span>
        </div>
        <div class="code" id="code"></div>
        <div class="commit" id="commit">
          <span class="av">C</span>
          <span><b>feat: filter records by tenant</b> · committed by Claude</span>
          <span class="ok">✓ deployed · prod-7f3a2c</span>
        </div>
        <div class="ebar"><span>main · TypeScript · UTF-8</span><span class="r"><span id="diffStat"></span><span id="eStat">Ln 16, Col 2</span></span></div>
      </div>

      <div class="right">
        <div class="panel">
          <div class="ph"><div class="l"><span style="color:var(--text)">Tenant boundaries</span><span class="tag">live</span></div><span id="mapTag" class="tag okk">isolated</span></div>
          <div class="map">
            <svg viewBox="0 0 640 330" width="640" height="330">
              <path class="wire ok" id="wA" d="M170 76 L440 76"/>
              <path class="wire ok" id="wB" d="M170 236 L440 236"/>
              <path id="breachPath" pathLength="1" d="M170 236 C300 236, 310 76, 440 76"/>
              <path id="atkPath" pathLength="1" d="M170 236 C300 236, 310 76, 440 76"/>
            </svg>
            <div class="node alice" style="left:20px;top:52px"><span class="av">A</span><div>Alice<small>tenant: t_alice</small></div></div>
            <div class="node bob" id="bob" style="left:20px;top:212px"><span class="av">B</span><div>Bob<small>tenant: t_bob</small></div></div>
            <div class="db" id="dbA" style="left:440px;top:24px">
              <div class="h"><span>◫ alice_db</span><span class="lock" id="lockA">● private</span></div>
              <div class="row"><i></i>invoice_2291 · $14,200</div>
              <div class="row"><i></i>contact · alice@acme.io</div>
              <div class="row"><i></i>ssn_hash · 9f2e…a1</div>
            </div>
            <div class="db" style="left:440px;top:184px">
              <div class="h"><span>◫ bob_db</span><span class="lock">● private</span></div>
              <div class="row"><i></i>invoice_1180 · $3,450</div>
              <div class="row"><i></i>contact · bob@globex.co</div>
              <div class="row"><i></i>notes · q3 renewal</div>
            </div>
            <div class="leaklbl" id="leakLbl" style="left:258px;top:112px">bob → alice_db · 3 rows read</div>
            <div class="pk" id="p1"></div><div class="pk" id="p2"></div><div class="pk" id="p3"></div>
            <div class="shield" id="shield">⛨ 403 · BLOCKED</div>
            <div class="inv"><span>INV-004 tenant_isolation</span><b id="invS" style="color:var(--green)">● holding</b></div>
          </div>
        </div>
        <div class="panel">
          <div class="ph"><div class="l"><span style="color:var(--text)">Terminal</span><span class="tag" id="termTag">deploy</span></div><span>zsh</span></div>
          <div class="term" id="term"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="alert" id="alert">
    <div class="t"><em>CRITICAL</em> ZERO · INCIDENT #0419</div>
    <h3>CRITICAL: Cross-tenant data exposure</h3>
    <p>Security invariant violated.</p>
    <code>assert(records.tenantId <s>==</s> session.tenantId)  <s>✗ FAILED</s></code>
  </div>
  <div id="flash"></div>

  <div id="final">
    <div class="zring"><svg viewBox="0 0 84 84" fill="none"><circle cx="42" cy="42" r="38" stroke="#fff" stroke-opacity=".9" stroke-width="2"/><circle cx="42" cy="42" r="28" stroke="#3ee08f" stroke-opacity=".5" stroke-width="1" stroke-dasharray="2 4"/><path d="M28 62 L56 22" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></div>
    <div class="word"><span>Z</span><span>E</span><span>R</span><span>O</span></div>
    <div class="tagline">AI writes the code. <b>ZERO verifies the boundaries.</b></div>
    <div class="stats">
      <div><span class="dot"></span>1 critical caught pre-exploit</div>
      <div><span class="dot"></span>patched in 4.1s</div>
      <div><span class="dot"></span>24/24 invariants verified</div>
    </div>
    <button id="replay"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Replay</button>
  </div>
</template>

<script>
const stage = document.getElementById('stage');
const tpl = document.getElementById('tpl');
function fit(){const s=Math.min(innerWidth/1600,innerHeight/900);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();

const CODE = [
  ['1','<span class="k">import</span> { auth } <span class="k">from</span> <span class="s">"@/lib/auth"</span>;'],
  ['2','<span class="k">import</span> { db } <span class="k">from</span> <span class="s">"@/lib/db"</span>;'],
  ['3',''],
  ['4','<span class="k">export async function</span> <span class="f">GET</span>(req<span class="p">:</span> Request) {'],
  ['5','  <span class="k">const</span> session = <span class="k">await</span> <span class="f">auth</span>(req);'],
  ['6','  <span class="k">if</span> (!session) <span class="k">return</span> <span class="f">unauthorized</span>();'],
  ['7',''],
  ['8','  <span class="cm">// new: let clients filter records by tenant</span>'],
  ['9','  <span class="k">const</span> { tenantId } = <span class="f">parseQuery</span>(req.url);','vuln'],
  ['+','  <span class="k">const</span> { tenantId } = session.user;','add'],
  ['+','  <span class="f">zero.assert</span>(<span class="s">"tenant_isolation"</span>, { session, tenantId });','add'],
  ['10',''],
  ['11','  <span class="k">const</span> records = <span class="k">await</span> db.records.<span class="f">findMany</span>({'],
  ['12','    where<span class="p">:</span> { tenantId },'],
  ['13','    orderBy<span class="p">:</span> { createdAt<span class="p">:</span> <span class="s">"desc"</span> },'],
  ['14','  });'],
  ['15','  <span class="k">return</span> Response.<span class="f">json</span>(records);'],
  ['16','}<span class="caret" id="caret"></span>'],
];

let timers=[], t0=0, raf=0;
const $=id=>document.getElementById(id);
const at=(ms,fn)=>timers.push(setTimeout(fn,ms));

function build(){
  stage.innerHTML='';stage.className='';
  stage.appendChild(tpl.content.cloneNode(true));
  const code=$('code');
  CODE.forEach(([g,c,cls])=>{
    const d=document.createElement('div');
    d.className='ln'+(cls?' '+cls+'-x':'');
    if(cls==='vuln') d.id='vline';
    if(cls==='add') d.classList.add('add');
    d.innerHTML=`<span class="g">${g}</span><span class="c">${c||' '}</span>`+(cls==='vuln'?'<span class="why">untrusted input → query</span>':'');
    code.appendChild(d);
  });
  $('replay').onclick=play;
}
function term(html,cls){const t=$('term');const d=document.createElement('div');d.className='tl'+(cls?' '+cls:'');d.innerHTML=html;t.appendChild(d);
  while(t.children.length>11)t.removeChild(t.firstChild);requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('show')));}
function clearTerm(){$('term').innerHTML=''}
function caption(n,label,text){const c=$('capL');c.classList.add('out');
  setTimeout(()=>{c.innerHTML=`<div class="eyebrow">${n} <span>${label}</span></div><h1>${text}</h1>`;c.classList.remove('out')},300)}
function status(cls,text){const s=$('status');s.className='status on '+cls;$('statusT').textContent=text}
function zstat(cls,text){$('zstat').className='zstat '+cls;$('zstatT').textContent=text}
function phase(p){stage.className=p}
function tick(){const e=Math.min(15000,performance.now()-t0);$('prog').style.width=(e/150)+'%';
  $('timer').textContent='00:'+String(Math.floor(e/1000)).padStart(2,'0');if(e<15000)raf=requestAnimationFrame(tick)}

function play(){
  timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf);
  build();t0=performance.now();raf=requestAnimationFrame(tick);
  const lines=[...document.querySelectorAll('.ln:not(.add)')];
  const adds=[...document.querySelectorAll('.ln.add')];

  /* 0–3s THE BUILD */
  phase('build');
  lines.forEach((l,i)=>at(150+i*85,()=>l.classList.add('show')));
  at(250,()=>term('<span class="m">$</span> <span class="w">git push origin main</span>'));
  at(650,()=>term('<span class="m">→</span> Building <span class="m">acme-crm@7f3a2c</span>…'));
  at(1150,()=>term('<span class="g">✓</span> Compiled 214 modules <span class="m">· 11.8s</span>'));
  at(1550,()=>term('<span class="g">✓</span> Type check passed'));
  at(1900,()=>{term('<span class="g">✓</span> Deployment successful <span class="m">· https://acme-crm.app</span>');$('commit').classList.add('show')});
  at(2100,()=>status('ok','Deployment successful'));

  /* 3–7s THE BREACH */
  at(3000,()=>{phase('breach');$('flash').classList.add('go');$('ui').classList.add('shake');
    caption('02','THE BREACH','An AI-generated update broke a security rule.');
    status('bad','Security invariant violated');zstat('bad','agent · 1 critical');
    $('commit').classList.remove('show');$('vline').classList.add('vuln');
    $('termTag').textContent='zero';$('termTag').className='tag zero';
    term('<span class="r">✗</span> <span class="w">[zero]</span> INV-004 tenant_isolation <span class="r">VIOLATED</span>','sum')});
  at(3500,()=>{$('bob').classList.add('attacker');$('breachPath').classList.add('draw');
    term('<span class="m">  GET</span> /api/records?tenantId=<span class="a">t_alice</span>  <span class="m">as</span> bob')});
  at(4200,()=>{['p1','p2','p3'].forEach((p,i)=>{const e=$(p);e.style.animationDelay=(i*.36)+'s';e.classList.add('run')});
    $('dbA').classList.add('leak');$('lockA').textContent='● exposed';$('leakLbl').classList.add('show');
    $('mapTag').textContent='breached';$('mapTag').className='tag';$('mapTag').style.cssText='color:var(--red);border-color:rgba(255,59,59,.5);background:var(--red-d)';
    $('invS').textContent='● violated';$('invS').style.color='var(--red)';
    term('<span class="m">  →</span> <span class="r">200 OK</span> · 3 rows from <span class="r">alice_db</span> leaked to t_bob')});
  at(4600,()=>{$('alert').classList.add('show');$('flash').classList.remove('go');void $('flash').offsetWidth;$('flash').classList.add('go')});
  at(5300,()=>term('<span class="m">  root cause:</span> tenantId read from query, not session'));
  at(5900,()=>term('<span class="m">  introduced by</span> 7f3a2c <span class="m">· route.ts:9 · 41s ago</span>'));

  /* 7–11s THE FIX */
  at(7000,()=>{phase('fix');$('alert').classList.remove('show');$('ui').classList.remove('shake');
    caption('03','THE FIX','ZERO writes the authorization patch.');
    status('work','Patching · running regression suite');zstat('work','agent · patching');
    $('edTag').textContent='⛨ ZERO · patch/tenant-guard';$('edTag').className='tag zero';
    $('vline').classList.add('del');$('vline').querySelector('.g').textContent='−';$('diffStat').innerHTML='<span style="color:var(--green)">+2</span> <span style="color:var(--red)">−1</span>';
    clearTerm();$('termTag').textContent='zero test';});
  at(7500,()=>adds[0].classList.add('show'));
  at(7900,()=>adds[1].classList.add('show'));
  at(8300,()=>term('<span class="m">$</span> <span class="w">zero test --security --regression</span>'));
  const tests=[
    ['alice reads alice/records','200'],
    ['bob reads alice/records','403'],
    ['tenantId bound to session','ok'],
    ['IDOR fuzz · 128 forged tenant ids','ok'],
    ['24 existing invariants hold','ok'],
  ];
  tests.forEach(([n,r],i)=>at(8700+i*330,()=>term(`<span class="g">✓</span> ${n} <span class="m">${'.'.repeat(Math.max(2,36-n.length))}</span> <span class="g">${r}</span>`)));
  at(10500,()=>term('<span class="g">PASS</span> <span class="w">29 passed</span> <span class="m">· 0 failed · 1.84s</span>','sum'));

  /* 11–15s VERIFIED */
  at(11000,()=>{phase('verified');
    caption('04','VERIFIED','The same attack is now blocked.');
    status('ok','Verified · boundary restored');zstat('ok','agent · all clear');
    $('edTag').textContent='✓ ZERO · verified';$('edTag').className='tag okk';
    ['p1','p2','p3'].forEach(p=>$(p).classList.remove('run'));
    $('breachPath').classList.add('gone');$('leakLbl').classList.remove('show');
    $('dbA').classList.remove('leak');$('dbA').classList.add('safe');$('lockA').textContent='● private';
    $('mapTag').textContent='isolated';$('mapTag').className='tag okk';$('mapTag').style.cssText='';
    $('invS').textContent='● holding';$('invS').style.color='var(--green)';
    term('<span class="m">$</span> <span class="w">zero replay incident #0419</span>')});
  at(11500,()=>{$('atkPath').classList.add('go');['p1','p2','p3'].forEach((p,i)=>{const e=$(p);e.style.animationDelay=(i*.33)+'s';e.classList.add('blk')})});
  at(12000,()=>{$('shield').classList.add('show');$('bob').classList.remove('attacker');
    term('<span class="m">  GET</span> /api/records?tenantId=t_alice <span class="m">as</span> bob <span class="g">→ 403 BLOCKED</span>')});
  at(12500,()=>term('<span class="g">✓</span> <span class="w">Exploit neutralized.</span> <span class="m">PR #212 opened · auto-merge on</span>','sum'));
  at(12700,()=>$('atkPath').classList.add('fade'));

  /* finale */
  at(13100,()=>$('final').classList.add('show'));
  at(13300,()=>$('final').classList.add('s1'));
  const sp=document.querySelectorAll('.word span');
  sp.forEach((s,i)=>at(13450+i*110,()=>{s.style.opacity=1;s.style.filter='none';s.style.transform='none'}));
  at(14000,()=>$('final').classList.add('s3'));
  at(14350,()=>$('final').classList.add('s4'));
  at(14700,()=>$('final').classList.add('s5'));
}
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')play()});
play();
</script>
