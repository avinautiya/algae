  <g id="text_22">
   <text style="fill: #404040; font: 8px 'DejaVu Sans'" transform="translate(13.968 464.14455)">Separate local TRAIN amplitude per stake; global parameters learned only on Tower1.</text>
   <text style="fill: #404040; font: 8px 'DejaVu Sans'" transform="translate(13.968 473.1028)">One glacier; four serial periods per stake; conditional hindcasts, not weather forecasts.</text>
   <text style="fill: #404040; font: 8px 'DejaVu Sans'" transform="translate(13.968 482.06105)">Camera uncertainty is unknown; no error bars or confidence intervals are inferred.</text>
